 GDP647_CHART_SIZE_CONSIDERABLE:0 "§Y大型经济 · 9级§!\n经济体量较大，全国波动能明显影响世界总量。 达到世界 GDP 的 6% 且总量至少为 $25B。"
 GDP647_CHART_SIZE_SUBSTANTIAL:0 "§Y较大经济 · 8级§!\n总产出在大型国家间也有明显分量。 达到世界 GDP 的 3.5% 且总量至少为 $12B。"
 GDP647_CHART_SIZE_ESTABLISHED:0 "§Y成熟经济 · 7级§!\n经济已具可观体量，在世界产出中占有一席之地。 达到世界 GDP 的 2% 且总量至少为 $5B。"
 GDP647_CHART_SIZE_MODERATE:0 "§Y中型经济 · 6级§!\n总产出达到中等规模，在区域经济中有一定分量。 达到世界 GDP 的 1% 且总量至少为 $2B。"
 GDP647_CHART_SIZE_DEVELOPING:0 "§Y成长中经济 · 5级§!\n国内产出已具一定规模，开始形成区域性的经济分量。 达到世界 GDP 的 0.5% 且总量至少为 $0.9B。"
 GDP647_CHART_SIZE_RUDIMENTARY:0 "§Y初级经济 · 4级§!\n国内市场已有一定体量，在全球仍占很小份额。 达到世界 GDP 的 0.2% 且总量至少为 $0.4B。"
 GDP647_CHART_SIZE_PERIPHERAL:0 "§Y边缘经济 · 3级§!\n已有可辨识的经济规模，在世界总产出中仍属边缘。 达到世界 GDP 的 0.08% 且总量至少为 $0.15B。"
 GDP647_CHART_SIZE_NEGLIGIBLE:0 "§Y微弱经济 · 2级§!\n产出规模很小，少数州的经济波动就可能左右全国总量。 达到世界 GDP 的 0.03% 且总量至少为 $0.05B。"
 GDP647_CHART_SIZE_PRIMITIVE:0 "§Y原始经济 · 1级§!\n全国总产出很少，新增一项生产活动也可能明显改变总量。 尚未达到第二档的相对与绝对门槛。"
