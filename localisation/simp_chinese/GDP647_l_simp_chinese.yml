 GDP647_CHART_DEVELOPMENT_UTOPIAN:0 "§Y极高产出 · 15级§!\n核心人均达到此分档的最高一档。 核心人均达到全球核心基准的 9 倍，且至少为 $8,200。"
 GDP647_CHART_DEVELOPMENT_TRANSCENDENTAL:0 "§Y超高产出 · 14级§!\n核心地区人均产出达到极少见的水平。 核心人均达到全球核心基准的 7.5 倍，且至少为 $6,500。"
 GDP647_CHART_DEVELOPMENT_RADIANT:0 "§Y高度发达 · 13级§!\n核心人均产出达到全球基准的六倍或以上。 核心人均达到全球核心基准的 6 倍，且至少为 $5,000。"
 GDP647_CHART_DEVELOPMENT_GILDED:0 "§Y高度富裕 · 12级§!\n核心地区人均产出处于罕见的高位。 核心人均达到全球核心基准的 4.5 倍，且至少为 $3,600。"
 GDP647_CHART_DEVELOPMENT_OPULENT:0 "§Y富足 · 11级§!\n核心地区单位人口产出已达到全球基准的数倍。 核心人均达到全球核心基准的 3.4 倍，且至少为 $2,500。"
 GDP647_CHART_DEVELOPMENT_PROSPEROUS:0 "§Y繁荣 · 10级§!\n核心人均产出远高于世界平均水平。 核心人均达到全球核心基准的 2.5 倍，且至少为 $1,800。"
 GDP647_CHART_DEVELOPMENT_VIBRANT:0 "§Y活跃发展 · 9级§!\n核心地区平均每人的产出接近全球水平的两倍。 核心人均达到全球核心基准的 1.85 倍，且至少为 $1,200。"
 GDP647_CHART_DEVELOPMENT_ROBUST:0 "§Y稳健发展 · 8级§!\n核心人均产出明显高于世界水平。 核心人均达到全球核心基准的 1.4 倍，且至少为 $800。"
 GDP647_CHART_DEVELOPMENT_COMFORTABLE:0 "§Y较为宽裕 · 7级§!\n核心地区平均每人的产出已超过全球基准。 核心人均达到全球核心基准的 1.05 倍，且至少为 $500。"
 GDP647_CHART_DEVELOPMENT_DECENT:0 "§Y基本发展 · 6级§!\n核心人均产出接近世界平均水平。 核心人均达到全球核心基准的 0.75 倍，且至少为 $300。"
 GDP647_CHART_DEVELOPMENT_MEAGER:0 "§Y产出有限 · 5级§!\n核心人均产出已超过最低几档，仍偏低。 核心人均达到全球核心基准的 0.52 倍，且至少为 $150。"
 GDP647_CHART_DEVELOPMENT_GRIMY:0 "§Y低度发展 · 4级§!\n核心地区人均产出低于全球基准，离平均水平有明显距离。 核心人均达到全球核心基准的 0.35 倍，且至少为 $80。"
 GDP647_CHART_DEVELOPMENT_HARDSCRABBLE:0 "§Y艰难自给 · 3级§!\n核心人均产出有所提高，但与世界平均水平差距仍大。 核心人均达到全球核心基准的 0.22 倍，且至少为 $35。"
 GDP647_CHART_DEVELOPMENT_SQUALID:0 "§Y严重匮乏 · 2级§!\n人均产出仍处于世界很低的水平。 核心人均达到全球核心基准的 0.12 倍，且至少为 $15。"
 GDP647_CHART_DEVELOPMENT_ABJECT:0 "§Y极度困乏 · 1级§!\n核心人均产出极低，人口规模和经济产出之间差距明显。 尚未达到第二档的相对与绝对门槛。"
