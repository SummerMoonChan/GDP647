 GDP647_CHART_SIZE_HEGEMON:0 "§YHegemon · Tier 15§!\nThe economy accounts for at least half of world output. At least 50% of world GDP and $700B in total output."
 GDP647_CHART_SIZE_TITAN:0 "§YTitan · Tier 14§!\nA striking share of worldwide output is concentrated in this one economy. At least 35% of world GDP and $400B in total output."
 GDP647_CHART_SIZE_PARAMOUNT:0 "§YParamount · Tier 13§!\nOutput approaches or exceeds a quarter of world GDP. At least 24% of world GDP and $220B in total output."
 GDP647_CHART_SIZE_DOMINANT:0 "§YDominant · Tier 12§!\nNational output makes up a substantial fraction of the world total. At least 18% of world GDP and $140B in total output."
 GDP647_CHART_SIZE_MAJOR:0 "§YMajor · Tier 11§!\nThis economy accounts for a major part of world output. At least 13% of world GDP and $90B in total output."
 GDP647_CHART_SIZE_POWERFUL:0 "§YPowerful · Tier 10§!\nNational output ranks among the largest in the world. At least 9% of world GDP and $50B in total output."
 GDP647_CHART_SIZE_CONSIDERABLE:0 "§YConsiderable · Tier 9§!\nDomestic fluctuations can noticeably change the world total. At least 6% of world GDP and $25B in total output."
 GDP647_CHART_SIZE_SUBSTANTIAL:0 "§YSubstantial · Tier 8§!\nOutput carries weight even alongside large national economies. At least 3.5% of world GDP and $12B in total output."
 GDP647_CHART_SIZE_ESTABLISHED:0 "§YEstablished · Tier 7§!\nThe economy has considerable domestic scale and a clear share of world output. At least 2% of world GDP and $5B in total output."
 GDP647_CHART_SIZE_MODERATE:0 "§YModerate · Tier 6§!\nOutput sits in the middle range and has a noticeable regional presence. At least 1% of world GDP and $2B in total output."
 GDP647_CHART_SIZE_DEVELOPING:0 "§YDeveloping · Tier 5§!\nDomestic output is large enough to carry some regional weight. At least 0.5% of world GDP and $0.9B in total output."
 GDP647_CHART_SIZE_RUDIMENTARY:0 "§YRudimentary · Tier 4§!\nThe domestic market has some scale and a small weight in world output. At least 0.2% of world GDP and $0.4B in total output."
 GDP647_CHART_SIZE_PERIPHERAL:0 "§YPeripheral · Tier 3§!\nThe economy has measurable scale but remains peripheral in global output. At least 0.08% of world GDP and $0.15B in total output."
 GDP647_CHART_SIZE_NEGLIGIBLE:0 "§YNegligible · Tier 2§!\nOutput is very small and can be heavily affected by changes in a few states. At least 0.03% of world GDP and $0.05B in total output."
 GDP647_CHART_SIZE_PRIMITIVE:0 "§YPrimitive · Tier 1§!\nOutput is minimal, so a single new activity can noticeably change the total. Below the combined thresholds for tier 2."
